<!DOCTYPE html>

<body class="profissionais">

    </nav>
    <p>Olá, bem vindo a nossa página de cadastro. Vou pedir algumas informações importantes de ti pois dessa forma posso saber a melhor forma para te ajudar.</p>
    

    <main class="conteudo_principal">
        <img src="assents/logo.jpg" alt="Identidade visual da biblioteca" class="logo">
        <h1>Novo leitor</h1>
        <form id="formulario_cadastro">
            <label for="nome">Nome
                <input type="text" id="nome" placeholder="Ex.: Maria" required>
            </label>
            <label for="email">E-mail
                <input type="Email" id="email" placeholder="Ex.: maria@gmail.com" required>
            </label>
            <label for="telefone">Telefone
                <input type="Tel" id="telefone" placeholder="Ex.: 71-91234-5678" required>
            </label>
            <label for="Profissional que necessita">Profissional
                <input type="Profissional" id="Profissional" placeholder="Ex:Cardiologista, pediatra..." required>
            </label>
            <!-- Pedir pra I.A colocar os profissionais como uma lista para que o cliente consiga selecionar qual achar melhor. -->
            <button type="button" onclick="funcaoCadastrarCliente()">Cadastrar</button>
        </form>
    </main>
<script src="cadastro.js"></script>
</body>
</html>
